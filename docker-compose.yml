services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - IMAGES=1
      - VOLUMES=1
      - POST=0
      - DELETE=0
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.40}
      - VERSION=1
      - INFO=1
      - EVENTS=1
      - PING=1
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SWARM=0
      - SYSTEM=0
    networks:
      - socket-net

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: always
    depends_on:
      - socket-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DYNU_API_KEY=${DYNU_API_KEY}
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.40}
    command:
      - "--log.level=INFO"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Global TLS defaults for websecure
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=myresolver"
      - "--entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}"
      # SSL Setup
      - "--certificatesresolvers.myresolver.acme.dnschallenge=true"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.provider=dynu"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    volumes:
      - ./config/letsencrypt:/letsencrypt
    networks:
      - socket-net
      - proxy-net
    labels:
      - "traefik.enable=true"
      
      # Middleware: Redirect to HTTPS
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # Middleware: Authelia Guard
      - "traefik.http.middlewares.authelia-auth.forwardauth.address=http://authelia:9091/api/verify?rd=https://auth.${DOMAIN}/"
      - "traefik.http.middlewares.authelia-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia-auth.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name"

      # Dashboard - Public (HTTPS)
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dash.entrypoints=websecure"
      - "traefik.http.routers.traefik-dash.tls=true"
      - "traefik.http.routers.traefik-dash.tls.certresolver=myresolver"
      - "traefik.http.routers.traefik-dash.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.traefik-dash.tls.domains[0].sans=*.${DOMAIN}"
      - "traefik.http.routers.traefik-dash.service=api@internal"
      - "traefik.http.routers.traefik-dash.middlewares=authelia-auth@docker"
      
      # Dashboard - Public (Redirect)
      - "traefik.http.routers.traefik-dash-red.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dash-red.entrypoints=web"
      - "traefik.http.routers.traefik-dash-red.middlewares=https-redirect@docker"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  lldap:
    image: nitnelave/lldap:stable
    container_name: lldap
    restart: always
    environment:
      - TZ=America/Bogota
      - LLDAP_HTTP_URL=https://users.${DOMAIN}
      - LLDAP_LDAP_BASE_DN=dc=roadtotech,dc=me
      - LLDAP_JWT_SECRET=${LLDAP_JWT_SECRET}
      - LLDAP_KEY_SEED=${LLDAP_KEY_SEED}
      - LLDAP_LDAP_USER_PASS=${LLDAP_LDAP_USER_PASS}
      - LLDAP_LDAP_USER_EMAIL=admin@${DOMAIN:-roadtotech.me}
      - LLDAP_DATABASE_URL=sqlite:///data/users.db?mode=rwc
    volumes:
      - ./config/lldap/data:/data
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      # Public (HTTPS)
      - "traefik.http.routers.lldap.rule=Host(`users.${DOMAIN}`)"
      - "traefik.http.routers.lldap.entrypoints=websecure"
      - "traefik.http.routers.lldap.tls=true"
      - "traefik.http.routers.lldap.tls.certresolver=myresolver"
      - "traefik.http.routers.lldap.service=lldap-svc"
      - "traefik.http.routers.lldap.middlewares=authelia-auth@docker"
      # Public (Redirect)
      - "traefik.http.routers.lldap-red.rule=Host(`users.${DOMAIN}`)"
      - "traefik.http.routers.lldap-red.entrypoints=web"
      - "traefik.http.routers.lldap-red.middlewares=https-redirect@docker"
      - "traefik.http.services.lldap-svc.loadbalancer.server.port=17170"

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: always
    user: "1000:100"
    depends_on:
      - lldap
    volumes:
      - ./config/authelia:/config
    environment:
      - DOMAIN=${DOMAIN}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}
      - AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD=${AUTHELIA_LDAP_PASSWORD:-${LLDAP_LDAP_USER_PASS}}
      - X_AUTHELIA_CONFIG_FILTERS=template
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      # Public (HTTPS)
      - "traefik.http.routers.authelia.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.routers.authelia.tls.certresolver=myresolver"
      # Public (Redirect)
      - "traefik.http.routers.authelia-red.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.authelia-red.entrypoints=web"
      - "traefik.http.routers.authelia-red.middlewares=https-redirect@docker"

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    command: >
      -H tcp://socket-proxy:2375
      --admin-password=${PORTAINER_ADMIN_PASSWORD}
      --no-analytics
    volumes:
      - portainer_data:/data
    networks:
      - socket-net
      - proxy-net
    labels:
      - "traefik.enable=true"
      # Public (HTTPS)
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.routers.portainer.tls.certresolver=myresolver"
      - "traefik.http.routers.portainer.middlewares=authelia-auth@docker"
      - "traefik.http.routers.portainer.service=portainer-svc"
      # Public (Redirect)
      - "traefik.http.routers.portainer-red.rule=Host(`portainer.${DOMAIN}`)"
      - "traefik.http.routers.portainer-red.entrypoints=web"
      - "traefik.http.routers.portainer-red.middlewares=https-redirect@docker"
      - "traefik.http.services.portainer-svc.loadbalancer.server.port=9000"

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: always
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.40}
    networks:
      - proxy-net
      - socket-net
    labels:
      - "traefik.enable=true"
      # Public (HTTPS)
      - "traefik.http.routers.logs.rule=Host(`logs.${DOMAIN}`)"
      - "traefik.http.routers.logs.entrypoints=websecure"
      - "traefik.http.routers.logs.tls=true"
      - "traefik.http.routers.logs.middlewares=authelia-auth@docker"
      - "traefik.http.routers.logs.service=logs-svc"
      # Public (Redirect)
      - "traefik.http.routers.logs-red.rule=Host(`logs.${DOMAIN}`)"
      - "traefik.http.routers.logs-red.entrypoints=web"
      - "traefik.http.routers.logs-red.middlewares=https-redirect@docker"
      - "traefik.http.services.logs-svc.loadbalancer.server.port=8080"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.40}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
    networks:
      - socket-net

  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: always
    command: serve
    depends_on:
      - socket-proxy
      - stalwart
    environment:
      - TZ=UTC
      - LOG_LEVEL=info
      - LOG_JSON=false
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_ENDPOINT=tcp://socket-proxy:2375
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_PROVIDERS_DOCKER_APIVERSION=${DOCKER_API_VERSION:-1.40}
      - DIUN_NOTIF_MAIL_HOST=stalwart
      - DIUN_NOTIF_MAIL_PORT=25
      - DIUN_NOTIF_MAIL_LOCALNAME=${DOMAIN:-roadtotech.me}
      - DIUN_NOTIF_MAIL_SSL=false
      - DIUN_NOTIF_MAIL_INSECURESKIPVERIFY=true
      - DIUN_NOTIF_MAIL_FROM=diun@${DOMAIN:-roadtotech.me}
      - DIUN_NOTIF_MAIL_TO=kiskaadee@${DOMAIN:-roadtotech.me}
    volumes:
      - ./config/diun:/data
    networks:
      - socket-net
      - proxy-net
  
  stalwart:
    image: stalwartlabs/stalwart:v0.16.22
    container_name: stalwart
    restart: always
    depends_on:
      - lldap
    ports: 
      - "25:25"       # Inbound SMTP (receiving mail)
      - "465:465"     # SMTPS (Submission with implicit TLS)
      - "587:587"     # SMTP Submission (STARTTLS for mail clients)
      - "993:993"     # IMAPS (Encrypted IMAP for Thunderbird/mobile)
      - "4190:4190"   # ManageSieve (Server-side mail rules)
    volumes: 
      - ./config/stalwart/etc:/etc/stalwart
      - ./config/stalwart/data:/var/lib/stalwart
    environment:
      - DOMAIN=${DOMAIN}
      - STALWART_PUBLIC_URL=https://mail.${DOMAIN}
      - STALWART_RECOVERY_ADMIN=admin:${LLDAP_LDAP_USER_PASS}
    networks:
      - proxy-net
    labels: 
      - "traefik.enable=true"
      # HTTPS WebAdmin & JMAP Router
      - "traefik.http.routers.stalwart.rule=Host(`mail.${DOMAIN}`)"
      - "traefik.http.routers.stalwart.entrypoints=websecure"
      - "traefik.http.routers.stalwart.tls=true"
      - "traefik.http.routers.stalwart.tls.certresolver=myresolver"
      - "traefik.http.routers.stalwart.service=stalwart-svc"
      # HTTP -> HTTPS Redirect
      - "traefik.http.routers.stalwart-red.rule=Host(`mail.${DOMAIN}`)"
      - "traefik.http.routers.stalwart-red.entrypoints=web"
      - "traefik.http.routers.stalwart-red.middlewares=https-redirect@docker"
      # Forward to Stalwart's internal HTTP/WebAdmin port
      - "traefik.http.services.stalwart-svc.loadbalancer.server.port=8080"

  snappymail:
    image: ghcr.io/the-djmaze/snappymail:latest
    container_name: snappymail
    restart: always
    depends_on:
      - stalwart
    volumes:
      - ./config/snappymail/data:/var/lib/snappymail/_data_
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      # Public (HTTPS)
      - "traefik.http.routers.webmail.rule=Host(`webmail.${DOMAIN}`)"
      - "traefik.http.routers.webmail.entrypoints=websecure"
      - "traefik.http.routers.webmail.tls=true"
      - "traefik.http.routers.webmail.tls.certresolver=myresolver"
      - "traefik.http.routers.webmail.service=webmail-svc"
      # Public (Redirect)
      - "traefik.http.routers.webmail-red.rule=Host(`webmail.${DOMAIN}`)"
      - "traefik.http.routers.webmail-red.entrypoints=web"
      - "traefik.http.routers.webmail-red.middlewares=https-redirect@docker"
      - "traefik.http.services.webmail-svc.loadbalancer.server.port=8888"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: always
    volumes:
      - ./config/homepage:/app/config
      - ./config/homepage/icons:/app/public/icons:ro
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_DOMAIN:-dashboard.${DOMAIN}}
    networks:
      - socket-net
      - proxy-net
    labels:
      - "traefik.enable=true"
      # Public (HTTPS)
      - "traefik.http.routers.homepage.rule=Host(`${HOMEPAGE_DOMAIN:-dashboard.${DOMAIN}}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.routers.homepage.tls.certresolver=myresolver"
      - "traefik.http.routers.homepage.service=homepage-svc"
      - "traefik.http.routers.homepage.middlewares=authelia-auth@docker"
      # Public (Redirect)
      - "traefik.http.routers.homepage-red.rule=Host(`${HOMEPAGE_DOMAIN:-dashboard.${DOMAIN}}`)"
      - "traefik.http.routers.homepage-red.entrypoints=web"
      - "traefik.http.routers.homepage-red.middlewares=https-redirect@docker"
      - "traefik.http.services.homepage-svc.loadbalancer.server.port=3000"

networks:
  proxy-net:
    external: true
  socket-net:
    external: true

volumes:
  portainer_data:
