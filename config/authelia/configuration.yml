server:
  address: tcp://0.0.0.0:9091

log:
  level: info

totp:
  issuer: authelia.com

authentication_backend:
  ldap:
    implementation: custom
    address: 'ldap://lldap:3890'
    timeout: 5s
    start_tls: false
    base_dn: 'dc=roadtotech,dc=me'
    additional_users_dn: 'ou=people'
    users_filter: '(&({username_attribute}={input})(objectClass=person))'
    additional_groups_dn: 'ou=groups'
    groups_filter: '(member={dn})'
    attributes:
      distinguished_name: 'dn'
      username: 'uid'
      display_name: 'displayName'
      mail: 'mail'
      group_name: 'cn'
    user: 'uid=admin,ou=people,dc=roadtotech,dc=me'

access_control:
  default_policy: deny
  rules:
    - domain: 'auth.{{ env "DOMAIN" }}'
      policy: bypass
    - domain: 'users.{{ env "DOMAIN" }}'
      policy: one_factor
    - domain: '*.{{ env "DOMAIN" }}'
      policy: one_factor

session:
  name: authelia_session
  secret: '{{ env "AUTHELIA_SESSION_SECRET" }}'
  expiration: 7d
  inactivity: 3d
  remember_me: 1M
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "DOMAIN" }}'

identity_validation:
  reset_password:
    jwt_secret: '{{ env "AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET" }}'

storage:
  local:
    path: /config/db.sqlite3
  encryption_key: '{{ env "AUTHELIA_STORAGE_ENCRYPTION_KEY" }}'

notifier:
  filesystem:
    filename: /config/emails.txt
