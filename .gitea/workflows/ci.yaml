name: Core Architecture & Invariant CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: nixery.dev/shell/coreutils/git/nix/nodejs:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory & Nix Flakes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
          echo "build-users-group =" >> ~/.config/nix/nix.conf

      - name: Run Architecture & Security Invariant Checks
        run: |
          nix flake check
